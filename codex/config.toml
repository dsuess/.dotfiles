approval_policy = "never"
default_permissions = "cwd-only"
model = "gpt-5.6-sol"
model_reasoning_effort = "xhigh"
plan_mode_reasoning_effort = "xhigh"
hide_agent_reasoning = true
service_tier = "default"

[permissions.cwd-only]
description = "Allow edits only in the active workspace root; allow installed CLI tools and RTK state."

[permissions.cwd-only.filesystem]
":minimal" = "read"
":tmpdir" = "write"
"~/.codex" = "read"
"~/bin" = "read"
"~/.local/bin" = "read"
"~/.local/share/rtk" = "write"
"~/.config/rtk" = "write"
"~/.config/uv" = "read"
"~/.uv/cache" = "write"
"~/.cache/uv" = "write"
"~/.local/share/uv" = "write"
"~/Library/Application Support/rtk" = "write"
"/opt/homebrew" = "read"
"/usr/local/bin" = "read"
"~/.config/git" = "read"
"~/.gitconfig" = "read"
"~/.gitconfig.local" = "read"
"~/.gitignore" = "read"
"~/.dotfiles" = "read"
"~/.profile" = "read"
"~/.bash_profile" = "read"
"~/.bashrc" = "read"
"~/.zprofile" = "read"
"~/.zshenv" = "read"
"~/.zshrc" = "read"
"~/.ssh/config" = "read"
"~/.ssh/known_hosts" = "read"
"~/.rustup" = "write"
"~/.cargo" = "write"

[permissions.cwd-only.filesystem.":workspace_roots"]
"." = "write"

[permissions.cwd-only.network]
enabled = true
mode = "full"

[projects."/Users/dsuess/.dotfiles"]
trust_level = "trusted"

[projects."/Users/dsuess/Code/reachy"]
trust_level = "trusted"

[projects."/Users/dsuess/Code/visonic"]
trust_level = "trusted"

[projects."/Users/dsuess"]
trust_level = "trusted"

[projects."/Users/dsuess/Library/Mobile Documents/iCloud~md~obsidian/Documents/notes/AOCRA Coaching"]
trust_level = "trusted"

[projects."/Users/dsuess/src/visonic"]
trust_level = "trusted"

[tui]
vim_mode_default = true

[tui.model_availability_nux]
"gpt-5.5" = 4
"gpt-5.6-sol" = 4
