id = "worktree-label"
name = "Worktree Label"
version = "0.3.0"
min_herdr_version = "0.8.2"
description = "Shows dynamic CWD labels with repository context for linked worktrees"
platforms = ["linux", "macos"]

[[startup]]
command = ["node", "index.js"]

[[events]]
on = "workspace.created"
command = ["node", "index.js"]

[[events]]
on = "workspace.focused"
command = ["node", "index.js"]

[[events]]
on = "tab.focused"
command = ["node", "index.js"]

[[events]]
on = "pane.focused"
command = ["node", "index.js"]
