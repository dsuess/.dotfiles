# Plan review uses tuicr's file-annotation mode, where every line is modeled as
# an addition. Keep additions on the Mocha base so a Markdown plan does not
# render as one large green diff. fg_dim intentionally matches panel_bg: tuicr
# uses it for line numbers, so the gutter remains but its digits are invisible.
panel_bg = "#1e1e2e"
bg_highlight = "#313244"
fg_primary = "#cdd6f4"
fg_secondary = "#bac2de"
fg_dim = "#1e1e2e"

syntax_theme = "pi-plan-review-mocha-markdown.tmTheme"

diff_add = "#cdd6f4"
diff_add_bg = "#1e1e2e"
diff_del = "#f38ba8"
diff_del_bg = "#181825"
diff_context = "#bac2de"
diff_hunk_header = "#89b4fa"
expanded_context_fg = "#6c7086"
syntax_add_bg = "#1e1e2e"
syntax_del_bg = "#181825"

file_added = "#a6e3a1"
file_modified = "#f9e2af"
file_deleted = "#f38ba8"
file_renamed = "#f5c2e7"
reviewed = "#a6e3a1"
pending = "#f9e2af"

comment_note = "#89b4fa"
comment_suggestion = "#94e2d5"
comment_issue = "#f38ba8"
comment_praise = "#a6e3a1"

border_focused = "#cba6f7"
border_unfocused = "#45475a"
status_bar_bg = "#181825"
cursor_color = "#fab387"
cursor_line_bg = "#313244"
branch_name = "#89dceb"
help_indicator = "#6c7086"

message_info_fg = "#1e1e2e"
message_info_bg = "#89b4fa"
message_warning_fg = "#1e1e2e"
message_warning_bg = "#f9e2af"
message_error_fg = "#1e1e2e"
message_error_bg = "#f38ba8"
update_badge_fg = "#1e1e2e"
update_badge_bg = "#f9e2af"
mode_fg = "#1e1e2e"
mode_bg = "#cba6f7"
